title: Scheduled Task Persistence Creation
id: NS-SIG-1003
status: production
description: Detects the creation of rogue scheduled tasks using schtasks.exe to establish persistence across reboots.
author: Kartavya
date: 2026/01/15
references:
  - https://attack.mitre.org/techniques/T1053/005/
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\schtasks.exe'
    CommandLine|contains:
      - '/create'
      - '/sc onstart'
      - '/sc onlogon'
      - '/ru system'
  condition: selection
falsepositives:
  - Software deployment scripts and software updates
level: high
